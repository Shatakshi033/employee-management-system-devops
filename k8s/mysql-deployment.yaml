apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        ports: [{containerPort: 3306}]
        env:
        - {name: MYSQL_DATABASE, valueFrom: {secretKeyRef: {name: employee-db-secret, key: MYSQL_DATABASE}}}
        - {name: MYSQL_USER, valueFrom: {secretKeyRef: {name: employee-db-secret, key: MYSQL_USER}}}
        - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: employee-db-secret, key: MYSQL_PASSWORD}}}
        - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: employee-db-secret, key: MYSQL_ROOT_PASSWORD}}}
        volumeMounts: [{name: mysql-storage, mountPath: /var/lib/mysql}]
        readinessProbe:
          exec:
            command: ["sh","-c",'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
      volumes:
      - name: mysql-storage
        persistentVolumeClaim: {claimName: mysql-data}
